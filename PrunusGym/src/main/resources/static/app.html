<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrunusGym</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="toast-stack" id="toastStack"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="name">Prunus<span>Gym</span></div>
      </div>
      <nav id="navMenu"></nav>
      <div class="user-box">
        <div class="who" id="userEmail"></div>
        <span class="role-badge" id="userRole"></span>
        <button class="btn btn-outline btn-sm btn-block logout" id="logoutBtn">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub"></div>
        </div>
      </div>
      <div class="content" id="content">
        <div class="loader">Cargando…</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
