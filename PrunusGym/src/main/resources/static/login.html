<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · PrunusGym</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">PG</div>
        <div class="name">Prunus<span>Gym</span></div>
      </div>
      <p class="tag-line" style="margin-top:-10px;margin-bottom:20px;">Ingresa con tu correo y contraseña.</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="username" placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Ingresar</button>
      </form>

      <p class="login-hint">
        ¿Eres nuevo? El registro público crea automáticamente tu cuenta de <b>Cliente</b>.
        <a href="#" id="toggleRegistro" style="color:var(--plum-600); font-weight:600;">Regístrate aquí</a>.
      </p>

      <form id="registroForm" style="display:none; margin-top:6px;">
        <div class="form-grid">
          <div class="field"><label>Nombre</label><input id="r_nombre" required></div>
          <div class="field"><label>Apellido</label><input id="r_apellido" required></div>
          <div class="field"><label>Documento (cédula)</label><input id="r_documento" required></div>
          <div class="field"><label>Teléfono</label><input id="r_telefono"></div>
          <div class="field full"><label>Correo electrónico</label><input type="email" id="r_email" required></div>
          <div class="field full"><label>Contraseña (mín. 8 caracteres)</label><input type="password" id="r_password" minlength="8" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="registroBtn">Crear mi cuenta</button>
        <button type="button" class="btn btn-outline btn-block" id="cancelRegistro" style="margin-top:8px;">Volver a iniciar sesión</button>
      </form>
    </div>
  </div>

<script>
  // Si ya hay sesión activa, ir directo a la app.
  if (localStorage.getItem("pg_token")) window.location.replace("app.html");

  const errorBox = document.getElementById("loginError");
  function showError(msg){ errorBox.textContent = msg; errorBox.style.display = "block"; }
  function hideError(){ errorBox.style.display = "none"; }

  document.getElementById("toggleRegistro").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registroForm").style.display = "block";
    hideError();
  });
  document.getElementById("cancelRegistro").addEventListener("click", () => {
    document.getElementById("registroForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    hideError();
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "Ingresando...";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        })
      });
      if (!res.ok) {
        throw new Error(res.status === 401 || res.status === 403 ? "Credenciales inválidas." : "No se pudo iniciar sesión.");
      }
      const data = await res.json();
      localStorage.setItem("pg_token", data.token);
      localStorage.setItem("pg_email", data.email);
      localStorage.setItem("pg_rol", data.rol);
      window.location.replace("app.html");
    } catch (err) {
      showError(err.message || "Error de conexión con el servidor.");
    } finally {
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  });

  document.getElementById("registroForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    const btn = document.getElementById("registroBtn");
    btn.disabled = true; btn.textContent = "Creando cuenta...";
    try {
      const body = {
        nombre: document.getElementById("r_nombre").value.trim(),
        apellido: document.getElementById("r_apellido").value.trim(),
        documento: document.getElementById("r_documento").value.trim(),
        telefono: document.getElementById("r_telefono").value.trim(),
        email: document.getElementById("r_email").value.trim(),
        password: document.getElementById("r_password").value
      };
      const res = await fetch("/api/clientes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.mensaje || "No se pudo completar el registro.");
      }
      // Registro OK -> iniciar sesión automáticamente
      const loginRes = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: body.email, password: body.password })
      });
      const data = await loginRes.json();
      localStorage.setItem("pg_token", data.token);
      localStorage.setItem("pg_email", data.email);
      localStorage.setItem("pg_rol", data.rol);
      window.location.replace("app.html");
    } catch (err) {
      showError(err.message || "Error de conexión con el servidor.");
    } finally {
      btn.disabled = false; btn.textContent = "Crear mi cuenta";
    }
  });
</script>
</body>
</html>
