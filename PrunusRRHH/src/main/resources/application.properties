spring.application.name=sistema-empleados

# ------------------------------------------------------
# Conexion a MariaDB
# createDatabaseIfNotExist=true crea la BD automaticamente
# si no existe (no necesitas crearla a mano en HeidiSQL/DBeaver/Workbench).
# ------------------------------------------------------
spring.datasource.url=jdbc:mariadb://localhost:3306/empleados_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update crea/actualiza tablas segun las entidades,
# pero NO elimina columnas viejas ni cambia tipos existentes.
# Si cambias la estructura de una entidad (ej: texto -> @ManyToOne),
# debes hacer DROP TABLE de esa tabla antes de reiniciar la app.
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Thymeleaf: desactivar cache para ver cambios de HTML sin reiniciar
spring.thymeleaf.cache=false
