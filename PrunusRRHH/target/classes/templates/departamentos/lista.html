<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <div class="page-header">
        <h2>Departamentos</h2>
        <a th:href="@{/departamentos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Nuevo departamento
        </a>
    </div>

    <div class="card p-3">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Empleados asociados</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dep : ${departamentos}">
                <td th:text="${dep.nombre}"></td>
                <td th:text="${#lists.size(dep.empleados)}"></td>
                <td class="text-end">
                    <a th:href="@{/departamentos/editar/{id}(id=${dep.id})}" class="btn btn-sm btn-outline-primary me-1">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/departamentos/eliminar/{id}(id=${dep.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar este departamento?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departamentos)}">
                <td colspan="3" class="text-center text-secondary py-4">No hay departamentos registrados todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
