<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <div class="page-header">
        <h2 th:text="${departamento.id == null} ? 'Nuevo departamento' : 'Editar departamento'">Departamento</h2>
        <a th:href="@{/departamentos}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <div class="card p-4" style="max-width: 480px;">
        <form th:action="@{/departamentos/guardar}" th:object="${departamento}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Nombre del departamento</label>
                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Recursos Humanos">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-check-lg me-1"></i> Guardar departamento
            </button>
        </form>
    </div>

</div>
</body>
</html>
