<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- th:fragment define un bloque reutilizable que el layout inserta con th:replace -->
<div th:fragment="contenido">

    <div class="page-header">
        <h2>Productos</h2>
        <a th:if="${hayCategorias}" th:href="@{/productos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Nuevo producto
        </a>
        <span th:unless="${hayCategorias}"
              class="btn btn-primary disabled"
              tabindex="-1"
              aria-disabled="true"
              title="Primero debes crear una categoría"
              style="opacity: 0.55; pointer-events: none;">
            <i class="bi bi-plus-lg me-1"></i> Nuevo producto
        </span>
    </div>

    <div th:unless="${hayCategorias}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Todavía no hay categorías registradas. <a th:href="@{/categorias/nueva}" class="link-fucsia">Crea una categoría</a> antes de agregar productos.
    </div>

    <div class="card p-3">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- th:each itera sobre la lista "productos" enviada desde el Controller -->
            <tr th:each="producto : ${productos}">
                <td>
                    <div th:text="${producto.nombre}"></div>
                    <div class="text-secondary small" th:if="${producto.descripcion}" th:text="${producto.descripcion}"></div>
                </td>
                <td th:text="${producto.categoria.nombre}"></td>
                <td th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${producto.cantidadStock}"></td>
                <td>
                    <span class="badge badge-activo" th:if="${producto.activo}">Activo</span>
                    <span class="badge badge-inactivo" th:unless="${producto.activo}">Inactivo</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-sm btn-outline-primary me-1">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar este producto?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="6" class="text-center text-secondary py-4">No hay productos registrados todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
