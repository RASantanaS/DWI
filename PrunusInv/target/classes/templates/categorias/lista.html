<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <div class="page-header">
        <h2>Categorías</h2>
        <a th:href="@{/categorias/nueva}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Nueva categoría
        </a>
    </div>

    <div class="card p-3">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Productos asociados</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.nombre}"></td>
                <td th:text="${#lists.size(cat.productos)}"></td>
                <td class="text-end">
                    <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary me-1">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar esta categoría?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="text-center text-secondary py-4">No hay categorías registradas todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
